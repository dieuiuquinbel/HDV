# Cấu hình Datasource H2 In-Memory dành riêng cho Unit/Integration Test
# Hoàn toàn độc lập với MySQL localhost:3306/booking_db thực tế
spring.datasource.url=jdbc:h2:mem:booking_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tự động sinh bảng trong RAM và drop khi kết thúc test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

