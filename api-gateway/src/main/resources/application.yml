server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms

gateway:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  court-service-url: ${COURT_SERVICE_URL:http://localhost:8082}
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

internal:
  api-key: ${INTERNAL_API_KEY:sport-internal-secret-key-2026-very-secure}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
